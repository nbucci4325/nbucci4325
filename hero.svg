<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Nico, Game Programmer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#140a3a"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbC">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM">
      <stop offset="0" stop-color="#ff2e97" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','SF Mono',Consolas,'Courier New',monospace; }
    @keyframes scan   { from { transform: translateY(-50px); } to { transform: translateY(300px); } }
    @keyframes glitchA{ 0%,90%,100% { transform: translate(0,0); } 92% { transform: translate(-6px,2px); } 94% { transform: translate(5px,-2px); } 97% { transform: translate(-3px,1px); } }
    @keyframes glitchB{ 0%,90%,100% { transform: translate(0,0); } 92% { transform: translate(6px,-2px); } 94% { transform: translate(-5px,2px); } 97% { transform: translate(3px,-1px); } }
    @keyframes float  { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-270px); opacity: 0; } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes pulse  { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .scan  { animation: scan 5s linear infinite; }
    .ga    { animation: glitchA 4s infinite; }
    .gb    { animation: glitchB 4s infinite; }
    .p     { animation: float 6s linear infinite; }
    .cur   { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <circle class="pulse" cx="150" cy="50" r="190" fill="url(#orbC)"/>
    <circle class="pulse" cx="880" cy="250" r="200" fill="url(#orbM)" style="animation-delay:1s"/>

    <circle class="p" cx="80"  cy="275" r="2"   fill="#00f0ff" style="animation-duration:7s;animation-delay:0s"/>
    <circle class="p" cx="170" cy="275" r="1.5" fill="#ff2e97" style="animation-duration:5s;animation-delay:1.2s"/>
    <circle class="p" cx="260" cy="275" r="2.5" fill="#00f0ff" style="animation-duration:8s;animation-delay:2.4s"/>
    <circle class="p" cx="350" cy="275" r="1.5" fill="#ffffff" style="animation-duration:6s;animation-delay:0.6s"/>
    <circle class="p" cx="430" cy="275" r="2"   fill="#ff2e97" style="animation-duration:7s;animation-delay:3.1s"/>
    <circle class="p" cx="520" cy="275" r="1.5" fill="#00f0ff" style="animation-duration:5.5s;animation-delay:1.8s"/>
    <circle class="p" cx="610" cy="275" r="2.5" fill="#ffffff" style="animation-duration:8s;animation-delay:4s"/>
    <circle class="p" cx="700" cy="275" r="2"   fill="#ff2e97" style="animation-duration:6.5s;animation-delay:0.3s"/>
    <circle class="p" cx="790" cy="275" r="1.5" fill="#00f0ff" style="animation-duration:7s;animation-delay:2.9s"/>
    <circle class="p" cx="870" cy="275" r="2"   fill="#ff2e97" style="animation-duration:5s;animation-delay:1.5s"/>
    <circle class="p" cx="940" cy="275" r="2.5" fill="#00f0ff" style="animation-duration:8s;animation-delay:3.6s"/>

    <rect class="scan" x="0" y="0" width="1000" height="50" fill="url(#band)"/>

    <g fill="none" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="2">
      <path d="M24 60V24H60"/>
      <path d="M940 24H976V60"/>
      <path d="M24 220V256H60"/>
      <path d="M940 256H976V220"/>
    </g>

    <g class="mono">
      <rect x="44" y="34" width="176" height="30" rx="15" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.5"/>
      <circle class="pulse" cx="63" cy="49" r="5" fill="#39ff88"/>
      <text x="78" y="54" font-size="13" fill="#9ef6ff" letter-spacing="2">OPEN TO CO-OP</text>

      <text class="ga" x="500" y="158" font-size="116" font-weight="800" letter-spacing="20" text-anchor="middle" fill="#00f0ff" fill-opacity="0.75">NICO</text>
      <text class="gb" x="500" y="158" font-size="116" font-weight="800" letter-spacing="20" text-anchor="middle" fill="#ff2e97" fill-opacity="0.75">NICO</text>
      <text x="500" y="158" font-size="116" font-weight="800" letter-spacing="20" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">NICO</text>

      <text x="500" y="208" font-size="19" letter-spacing="5" text-anchor="middle" fill="#9ef6ff">GAMEPLAY SYSTEMS  ·  AI PROGRAMMING  ·  UNITY<tspan class="cur" fill="#ff2e97">_</tspan></text>
      <text x="500" y="244" font-size="13" letter-spacing="3" text-anchor="middle" fill="#7d8aa8">GAME PROGRAMMING  ·  BROCK / NIAGARA COLLEGE</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#00f0ff" stroke-opacity="0.25"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
