<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7b2ff7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes run   { from { transform: translateX(-200px); } to { transform: translateX(1040px); } }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .dash { animation: run 4s linear infinite; }
    .dia  { animation: pulse 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="11" width="1000" height="2" fill="url(#line)"/>
  <rect class="dash" x="0" y="10" width="160" height="4" rx="2" fill="url(#dash)" filter="url(#glow)"/>
  <rect class="dia" x="494" y="6" width="12" height="12" transform="rotate(45 500 12)" fill="#0d1117" stroke="#00f0ff" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
