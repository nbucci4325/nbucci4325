<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Character sheet: Nico, Game Programmer, Brock / Niagara College, C# and Unity, open to co-op" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c18"/>
      <stop offset="1" stop-color="#140a3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="760" height="350" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','SF Mono',Consolas,'Courier New',monospace; }
    .lab  { font-size: 13px; letter-spacing: 3px; fill: #00f0ff; }
    .val  { font-size: 18px; fill: #e6faff; }
    @keyframes scan  { from { transform: translateY(-60px); } to { transform: translateY(360px); } }
    @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .scan { animation: scan 6s linear infinite; }
    .pulse{ animation: pulse 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="760" height="350" fill="url(#bg)"/>
    <rect class="scan" width="760" height="60" fill="url(#band)"/>
    <rect width="5" height="350" fill="url(#neon)"/>
  </g>
  <rect x="0.5" y="0.5" width="759" height="349" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.35"/>

  <g class="mono">
    <text x="40" y="38" font-size="15" letter-spacing="5" fill="url(#neon)" filter="url(#glow)">CHARACTER SHEET</text>
    <text x="720" y="38" font-size="12" letter-spacing="3" text-anchor="end" fill="#7d8aa8">PLAYER 1</text>
    <rect x="40" y="52" width="680" height="1.5" fill="url(#neon)" fill-opacity="0.6"/>

    <g>
      <rect x="40" y="62" width="680" height="32" fill="#00f0ff" fill-opacity="0.04"/>
      <g><text class="lab" x="56" y="83">PLAYER</text><text class="val" x="230" y="84">Nico</text></g>
    </g>
    <g><text class="lab" x="56" y="115">CLASS</text><text class="val" x="230" y="116">Game Programmer</text></g>
    <g>
      <rect x="40" y="126" width="680" height="32" fill="#00f0ff" fill-opacity="0.04"/>
      <g><text class="lab" x="56" y="147">GUILD</text><text class="val" x="230" y="148">Brock / Niagara College</text></g>
    </g>
    <g><text class="lab" x="56" y="179">MAIN HAND</text><text class="val" x="230" y="180">C# / Unity</text></g>
    <g>
      <rect x="40" y="190" width="680" height="32" fill="#00f0ff" fill-opacity="0.04"/>
      <g><text class="lab" x="56" y="211">OFF HAND</text><text class="val" x="230" y="212">Python</text></g>
    </g>
    <g><text class="lab" x="56" y="243">SPELLBOOK</text><text class="val" x="230" y="244">Genetic Algorithms, FSMs</text></g>
    <g>
      <rect x="40" y="254" width="680" height="32" fill="#00f0ff" fill-opacity="0.04"/>
      <g><text class="lab" x="56" y="275">QUEST</text><text class="val" x="230" y="276">Land a co-op</text></g>
    </g>
    <g>
      <text class="lab" x="56" y="307">STATUS</text>
      <circle class="pulse" cx="238" cy="302" r="6" fill="#39ff88"/>
      <text class="val" x="254" y="308" fill="#39ff88" style="fill:#39ff88">Open to party invites</text>
    </g>
  </g>

  <g fill="none" stroke="#ff2e97" stroke-opacity="0.7" stroke-width="2">
    <path d="M720 322V338H704"/>
    <path d="M40 338H56"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
