<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Terminal: whoami, focus, skills, status" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','SF Mono',Consolas,'Courier New',monospace; font-size: 17px; }
    .pr  { fill: #ff2e97; }
    .pt  { fill: #00f0ff; }
    .cmd { fill: #e6faff; }
    .out { fill: #9aa7c2; }
    .hl  { fill: #00f0ff; }
    @keyframes line {
      0%   { opacity: 0; transform: translateX(-8px); }
      3%   { opacity: 1; transform: translateX(0); }
      88%  { opacity: 1; transform: translateX(0); }
      96%  { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    .l   { animation: line 15s linear infinite backwards; }
    .cur { animation: blink 1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="#0d1117" stroke="#00f0ff" stroke-opacity="0.35"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h875a12 12 0 0 1 12 12V44H0.5Z" fill="url(#titlebar)"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="22" r="6" fill="#27c93f"/>
  <text class="mono" x="450" y="27" font-size="14" text-anchor="middle" fill="#7d8aa8">nico@gamedev: ~</text>

  <g class="mono">
    <text class="l" x="28" y="84"  style="animation-delay:0s"><tspan class="pr">nico@gamedev</tspan><tspan class="pt">:~$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text class="l out" x="28" y="112" style="animation-delay:1s">&gt; Game Programming student · Brock / Niagara College</text>

    <text class="l" x="28" y="148" style="animation-delay:2s"><tspan class="pr">nico@gamedev</tspan><tspan class="pt">:~$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
    <text class="l out" x="28" y="176" style="animation-delay:3s">&gt; <tspan class="hl">Gameplay Systems</tspan> · <tspan class="hl">AI Programming</tspan> · Tools</text>

    <text class="l" x="28" y="212" style="animation-delay:4s"><tspan class="pr">nico@gamedev</tspan><tspan class="pt">:~$ </tspan><tspan class="cmd">ls skills/</tspan></text>
    <text class="l out" x="28" y="240" style="animation-delay:5s">&gt; C#   .NET   Unity   Python   Java   SQL</text>

    <text class="l" x="28" y="276" style="animation-delay:6s"><tspan class="pr">nico@gamedev</tspan><tspan class="pt">:~$ </tspan><tspan class="cmd" filter="url(#glow)">status --co-op</tspan><tspan class="out">  </tspan><tspan fill="#39ff88">● open</tspan><tspan class="cur pt"> ▮</tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
