<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Project log: StockGA, Unity Utilities, UML Designer, Showtime Bot" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c18"/>
      <stop offset="1" stop-color="#140a3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="290" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','SF Mono',Consolas,'Courier New',monospace; }
    .hd   { font-size: 12px; letter-spacing: 3px; fill: #7d8aa8; }
    .nm   { font-size: 16px; font-weight: 700; fill: #00f0ff; }
    .st   { font-size: 14px; fill: #ff6fb5; }
    .ds   { font-size: 14px; fill: #c9d1d9; }
    @keyframes tick  { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    .tick { animation: tick 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="290" fill="url(#bg)"/>
    <rect width="900" height="5" fill="url(#neon)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="289" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.35"/>

  <g class="mono">
    <text x="36" y="40" font-size="15" letter-spacing="5" fill="url(#neon)" filter="url(#glow)">PROJECT LOG</text>

    <text class="hd" x="36"  y="76">PROJECT</text>
    <text class="hd" x="250" y="76">STACK</text>
    <text class="hd" x="480" y="76">WHAT IT DOES</text>
    <rect x="36" y="86" width="828" height="1.5" fill="url(#neon)" fill-opacity="0.6"/>

    <g>
      <rect x="36" y="96" width="828" height="40" fill="#00f0ff" fill-opacity="0.04"/>
      <g>
        <rect class="tick" x="36" y="102" width="3" height="28" fill="#00f0ff"/>
        <text class="nm" x="52" y="122">StockGA</text>
        <text class="st" x="250" y="121">Python · GA · Neural Net</text>
        <text class="ds" x="480" y="121">GA-evolved trading signals + neural net</text>
      </g>
    </g>

    <g>
      <rect class="tick" x="36" y="146" width="3" height="28" fill="#00f0ff" style="animation-delay:0.3s"/>
      <text class="nm" x="52" y="166">Unity Utilities</text>
      <text class="st" x="250" y="165">C# · Unity</text>
      <text class="ds" x="480" y="165">Singleton&lt;T&gt;, object pools, slider drawer</text>
    </g>

    <g>
      <rect x="36" y="184" width="828" height="40" fill="#00f0ff" fill-opacity="0.04"/>
      <g>
        <rect class="tick" x="36" y="190" width="3" height="28" fill="#00f0ff" style="animation-delay:0.6s"/>
        <text class="nm" x="52" y="210">UML Designer</text>
        <text class="st" x="250" y="209">Python · PySide6</text>
        <text class="ds" x="480" y="209">Class diagrams, undo/redo, auto releases</text>
      </g>
    </g>

    <g>
      <rect class="tick" x="36" y="234" width="3" height="28" fill="#00f0ff" style="animation-delay:0.9s"/>
      <text class="nm" x="52" y="254">Showtime Bot</text>
      <text class="st" x="250" y="253">Python · Discord</text>
      <text class="ds" x="480" y="253">Showtime alerts via GitHub Actions</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
